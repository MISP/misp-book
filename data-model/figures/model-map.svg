<svg width="714.4453125" height="408" id="misp-model-map" xmlns="http://www.w3.org/2000/svg" class="flowchart" viewBox="0 0 714.4453125 408" role="graphics-document document" aria-roledescription="flowchart-v2" aria-describedby="chart-desc-misp-model-map" aria-labelledby="chart-title-misp-model-map"><title id="chart-title-misp-model-map">Four complementary views of the MISP data model</title><desc id="chart-desc-misp-model-map">A teaching map groups events, attributes, objects and Event Reports as structure; tags, taxonomies, galaxies and clusters as context; Analyst Data, sightings and proposals as analysis and feedback; and organizations, distribution and sharing groups as sharing. These are views of the model, not separate databases or containment relationships.</desc><style>#misp-model-map{font-family:DejaVu Sans,sans-serif;font-size:16px;fill:#153448;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#misp-model-map .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#misp-model-map .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#misp-model-map .error-icon{fill:#ffffff;}#misp-model-map .error-text{fill:#000000;stroke:#000000;}#misp-model-map .edge-thickness-normal{stroke-width:1px;}#misp-model-map .edge-thickness-thick{stroke-width:3.5px;}#misp-model-map .edge-pattern-solid{stroke-dasharray:0;}#misp-model-map .edge-thickness-invisible{stroke-width:0;fill:none;}#misp-model-map .edge-pattern-dashed{stroke-dasharray:3;}#misp-model-map .edge-pattern-dotted{stroke-dasharray:2;}#misp-model-map .marker{fill:#516479;stroke:#516479;}#misp-model-map .marker.cross{stroke:#516479;}#misp-model-map svg{font-family:DejaVu Sans,sans-serif;font-size:16px;}#misp-model-map p{margin:0;}#misp-model-map .label{font-family:DejaVu Sans,sans-serif;color:#153448;}#misp-model-ma