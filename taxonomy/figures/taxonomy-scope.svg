,sans-serif;color:#153448;}#misp-taxonomy-scope .cluster-label text{fill:#000000;}#misp-taxonomy-scope .cluster-label span{color:#000000;}#misp-taxonomy-scope .cluster-label span p{background-color:transparent;}#misp-taxonomy-scope .label text,#misp-taxonomy-scope span{fill:#153448;color:#153448;}#misp-taxonomy-scope .node rect,#misp-taxonomy-scope .node circle,#misp-taxonomy-scope .node ellipse,#misp-taxonomy-scope .node polygon,#misp-taxonomy-scope .node path{fill:#e7f6fa;stroke:#007b96;stroke-width:1px;}#misp-taxonomy-scope .rough-node .label text,#misp-taxonomy-scope .node .label text,#misp-taxonomy-scope .image-shape .label,#misp-taxonomy-scope .icon-shape .label{text-anchor:middle;}#misp-taxonomy-scope .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#misp-taxonomy-scope .rough-node .label,#misp-taxonomy-scope .node .label,#misp-taxonomy-scope .image-shape .label,#misp-taxonomy-scope .icon-shape .label{text-align:center;}#misp-taxonomy-scope .node.clickable{cursor:pointer;}#misp-taxonomy-scope .root .anchor path{fill:#516479!important;stroke-width:0;stroke:#516479;}#misp-taxonomy-scope .arrowheadPath{fill:#0b0b0b;}#misp-taxonomy-scope .edgePath .path{stroke:#516479;stroke-width:2.0px;}#misp-taxonomy-scope .flowchart-link{stroke:#516479;fill:none;}#misp-taxonomy-scope .edgeLabel{background-color:#ffffff;text-align:center;}#misp-taxonomy-scope .edgeLabel p{background-color:#ffffff;}#misp-taxonomy-scope .edgeLabel rect{opacity:0.5;background-color:#ffffff;fill:#ffffff;}#misp-taxonomy-scope .labelBkg{background-color:rgba(255, 255, 255, 0.5);}#misp-taxonomy-scope .cluster rect{fill:#f8fafc;stroke:#bccbd5;stroke-width:1px;}#misp-taxonomy-scope .cluster text{fill:#000000;}#misp-taxonomy-scope .cluster span{color:#000000;}#misp-taxonomy-scope div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:DejaVu Sans,sans-serif;font-size:12px;background:#ffffff;border:1px solid hsl(0, 0%, 90%);border-radius:2px;pointer-events:none;z-index:100;}#misp-taxonomy-scope .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#153448;}#misp-taxonomy-scope rect.text{fill:none;stroke-width:0;}#misp-taxonomy-scope .icon-shape,#misp-taxonomy-scope .image-shape{background-color:#ffffff;text-align:center;}#misp-taxonomy-scope .icon-shape p,#misp-taxonomy-scope .image-shape p{background-color:#ffffff;padding:2px;}#misp-taxonomy-scope .icon-shape rect,#misp-taxonomy-scope .image-shape rect{opacity:0.5;background-color:#ffffff;fill:#ffffff;}#misp-taxonomy-scope .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#misp-taxonomy-scope .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#misp-taxonomy-scope :root{--mermaid-font-family:DejaVu Sans,sans-serif;}</style><g><marker id="misp-taxonomy-scope_flowchart-v2-pointEnd" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"></path></marker><marker id="misp-taxonomy-scope_flowchart-v2-pointStart" class="marker flowchart-v2" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 5 L 10 10 L 10 0 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"></path></marker><marker id="misp-taxonomy-scope_flowchart-v2-circleEnd" class="marker flowchart-v2" viewBox="0 0 10 10" refX="11" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><circle cx="5" cy="5" r="5" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"></circle></marker><marker id="misp-taxonomy-scope_flowchart-v2-circleStart" class="marker flowchart-v2" viewBox="0 0 10 10" refX="-1" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><circle cx="5" cy="5" r="5" class="ar