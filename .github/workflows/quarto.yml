name: Build & publish MISP book

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Build all three formats on every push/PR (replaces the old Honkit build,
  # preserving the "CI builds HTML + PDF + EPUB" guarantee — D6).
  #
  # Rendering is hermetic: executable PyMISP/REST cells are frozen into
  # _freeze/ (committed), so Quarto does not need a live MISP instance or a
  # Python kernel here. PDF is produced with the Typst engine bundled in the
  # Quarto binary — no LaTeX toolchain required.
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check generated data model reference
        run: python3 assets/data-model/generate_reference.py --check

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.38"       # pinned so the committed _freeze/ stays valid
          tinytex: false          # Typst is used for PDF, not LaTeX

      - name: Render HTML + PDF + EPUB
        run: quarto render

      - name: Provide legacy download filenames
        run: |
          # Keep the historical /doc/misp/book.pdf and book.epub URLs working.
          cp "_book/MISP-User-Guide.pdf"  "_book/book.pdf"  || true
          cp "_book/MISP-User-Guide.epub" "_book/book.epub" || true

      - name: Upload rendered book
        uses: actions/upload-artifact@v4
        with:
          name: misp-book
          path: _book
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Link integrity: validate every internal link and heading anchor resolves.
  # Runs offline against the rendered HTML so it is deterministic (no flakiness
  # from external hosts / rate limits). Enforces the migration's link-integrity
  # acceptance criterion.
  # ---------------------------------------------------------------------------
  link-check:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: misp-book
          path: _book

      - name: Check internal links & anchors (offline)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --include-fragments --no-progress
            "_book/**/*.html"
          fail: true

  # ---------------------------------------------------------------------------
  # Publish to the two CIRCL servers via rsync-over-SSH (D7). Runs only on a
  # push to main and only when the deploy secrets are configured, so forks and
  # PR builds never attempt to deploy.
  #
  # Required repository secrets:
  #   CIRCL_DEPLOY_KEY   - private SSH key authorised for the circl@ accounts
  #   CIRCL_KNOWN_HOSTS  - output of `ssh-keyscan` for both target hosts
  # ---------------------------------------------------------------------------
  deploy:
    needs: [build, link-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: misp-book
          path: _book

      - name: Gate on deploy secret
        id: gate
        env:
          KEY: ${{ secrets.CIRCL_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "CIRCL_DEPLOY_KEY not set — skipping publish."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        if: steps.gate.outputs.go == 'true'
        env:
          KEY: ${{ secrets.CIRCL_DEPLOY_KEY }}
          HOSTS: ${{ secrets.CIRCL_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY"   > ~/.ssh/id_deploy
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts

      - name: rsync to CIRCL servers
        if: steps.gate.outputs.go == 'true'
        run: |
          RSH="ssh -i ~/.ssh/id_deploy -o UserKnownHostsFile=~/.ssh/known_hosts"
          # --delete makes the target an exact mirror of _book/, removing stale
          # Honkit artefacts (gitbook/ assets, search_index.json, translation/ja_JP.html,
          # old book.mobi) instead of leaving them to serve outdated content. The target
          # dir is dedicated to the book, so nothing else lives there to be pruned.
          rsync -az --delete -e "$RSH" _book/ circl@cpab.circl.lu:/var/www/nwww.circl.lu/doc/misp/
          rsync -az --delete -e "$RSH" _book/ circl@www-circl-lu.cfss1.circl.lu:/var/www/www.circl.lu/doc/misp/
