<svg width="533.46875" height="700.940673828125" id="misp-protected-sync" xmlns="http://www.w3.org/2000/svg" class="flowchart" viewBox="0 0 533.46875 700.940673828125" role="graphics-document document" aria-roledescription="flowchart-v2" aria-describedby="chart-desc-misp-protected-sync" aria-labelledby="chart-title-misp-protected-sync"><title id="chart-title-misp-protected-sync">Protected events are signed and checked at each ordinary synchronization hop</title><desc id="chart-desc-misp-protected-sync">A signs with an instance key listed on the event. B checks the signature and authorised signer before accepting the protected event. To relay it, B must sign with its own instance key, which must also be on the authorised list. C checks B's signature. If B cannot sign with an authorised key, onward relay stops. This describes ordinary external synchronization, not privileged administrator or internal-sync trust paths.</desc><style>#misp-protected-sync{font-family:DejaVu Sans,sans-serif;font-size:16px;fill:#153448;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#misp-protected-sync .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#misp-protected-sync .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#misp-protected-sync .error-icon{fill:#ffffff;}#misp-protected-sync .error-text{fill:#000000;stroke:#000000;}#misp-protected-sync .edge-thickness-normal{stroke-width:1px;}#misp-protected-sync .edge-thickness-thick{stroke-width:3.5px;}#misp-protected-sync .edge-pattern-solid{stroke-dasharray:0;}#misp-protected-sync .edge-thickness-invisible{stroke-width:0;fill:none;}#misp-protected-sync .edge-pattern-dashed{stroke-dasharray:3;}#misp-protected-sync .edge-pattern-dotted{stroke-dasharray:2;}#misp-protected-sync .marker{fill:#516479;stroke:#516479;}#misp-protected-sy