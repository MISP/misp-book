ground-color:#ffffff;fill:#ffffff;}#misp-notification-consumer .labelBkg{background-color:rgba(255, 255, 255, 0.5);}#misp-notification-consumer .cluster rect{fill:#f8fafc;stroke:#bccbd5;stroke-width:1px;}#misp-notification-consumer .cluster text{fill:#000000;}#misp-notification-consumer .cluster span{color:#000000;}#misp-notification-consumer div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:DejaVu Sans,sans-serif;font-size:12px;background:#ffffff;border:1px solid hsl(0, 0%, 90%);border-radius:2px;pointer-events:none;z-index:100;}#misp-notification-consumer .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#153448;}#misp-notification-consumer rect.text{fill:none;stroke-width:0;}#misp-notification-consumer .icon-shape,#misp-notification-consumer .image-shape{background-color:#ffffff;text-align:center;}#misp-notification-consumer .icon-shape p,#misp-notification-consumer .image-shape p{background-color:#ffffff;padding:2px;}#misp-notification-consumer .icon-shape rect,#misp-notification-consumer .image-shape rect{opacity:0.5;background-color:#ffffff;fill:#ffffff;}#misp-notification-consumer .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#misp-notification-consumer .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#misp-notification-consumer :root{--mermaid-font-family:DejaVu Sans,sans-serif;}#misp-notification-consumer .stream rect{fill:#fff4df!important;stroke:#91651c!important;color:#573d13!important;}#misp-notification-consumer .stream polygon{fill:#fff4df!important;stroke:#91651c!important;color:#573d13!important;}#misp-notification-consumer .stream ellipse{fill:#fff4df!important;stroke:#91651c!important;color:#573d13!important;}#misp-notification-consumer .stream circle{fill:#fff4df!important;stroke:#91651c!important;color:#573d13!important;}#misp-notification-consumer .stream path{fill:#fff4df!important;stroke:#91651c!important;color:#573d13!impo