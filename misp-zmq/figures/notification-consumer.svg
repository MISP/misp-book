<svg width="565.8125" height="508.20001220703125" id="misp-notification-consumer" xmlns="http://www.w3.org/2000/svg" class="flowchart" viewBox="0 0 565.8125 508.20001220703125" role="graphics-document document" aria-roledescription="flowchart-v2" aria-describedby="chart-desc-misp-notification-consumer" aria-labelledby="chart-title-misp-notification-consumer"><title id="chart-title-misp-notification-consumer">Notifications trigger trusted processing and REST supports recovery</title><desc id="chart-desc-misp-notification-consumer">Instance activity feeds the configured ZeroMQ publisher, whose stream does not apply per-user distribution filtering. A trusted consumer receives live notifications and can also query current state or reconcile through an API account with its own permissions. The consumer applies idempotent target changes. ZeroMQ is not a durable replay queue, and narrower REST permissions do not narrow data already received from the stream.</desc><style>#misp-notification-consumer{font-family:DejaVu Sans,sans-serif;font-size:16px;fill:#153448;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#misp-notification-consumer .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#misp-notification-consumer .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#misp-notification-consumer .error-icon{fill:#ffffff;}#misp-notification-consumer .error-text{fill:#000000;stroke:#000000;}#misp-notification-consumer .edge-thickness-normal{stroke-width:1px;}#misp-notification-consumer .edge-thickness-thick{stroke-width:3.5px;}#misp-notification-consumer .edge-pattern-solid{stroke-dasharray:0;}#misp-notification-consumer .edge-thickness-invisible{stroke-width:0;fill:none;}#misp-notification-consumer .edge-pattern-dashed{stroke-dasharray:3;}#misp-notification-consumer .edge