project:
  type: book
  output-dir: _book

book:
  title: "MISP User Guide"
  subtitle: "MISP Intelligence Sharing Platform"
  author: "The MISP Project & Contributors"
  date: today
  favicon: assets/misp-2-verti.png
  cover-image: cover.jpg
  # Served from a subpath; keep canonical/sitemap URLs correct (A2).
  site-url: https://www.circl.lu/doc/misp/
  repo-url: https://github.com/MISP/misp-book
  repo-branch: main
  repo-actions: [edit, issue]        # "Edit this page" / "Report an issue"
  search: true
  sidebar:
    logo: assets/misp-2-verti.png
    style: docked
    collapse-level: 1
  page-footer:
    left: "MISP User Guide — dual-licensed AGPLv3 & CC-BY-SA 4.0"
    right: "Built with [Quarto](https://quarto.org)"
  downloads: [pdf, epub]             # replaces the old manual PDF/EPUB sidebar links
  # Emit book.pdf / book.epub (not the title-slug default MISP-User-Guide.*) so the
  # long-standing external links www.circl.lu/doc/misp/book.pdf and .../book.epub keep
  # resolving after the Honkit->Quarto switch. (MOBI was intentionally dropped.)
  output-file: book
  # Chapters grouped into thematic parts (PRD B6). The root index.qmd is the
  # preface (before the first part); reading order flows newcomer -> advanced.
  chapters:
    - index.qmd
    - part: "Getting Started"
      chapters:
        - book-convention/index.qmd
        - general-concepts/index.qmd
        - requirements/index.qmd
        - get-your-instance/index.qmd
        - quick-start/index.qmd
        - general-layout/index.qmd
    - part: "Using MISP"
      chapters:
        - user-management/index.qmd
        - using-the-system/index.qmd
        - event-templates/index.qmd
        - dashboards/index.qmd
        - extended-events/index.qmd
        - create-event-report/index.qmd
        - event-reports/index.qmd
        - analyst-data/index.qmd
        - sightings/index.qmd
        - decaying-models/index.qmd
        - delegation/index.qmd
        - best-practices/index.qmd
    - part: "Data Model & Context"
      chapters:
        - data-model/index.qmd
        - categories-and-types/index.qmd
        - taxonomy/index.qmd
        - galaxy/index.qmd
        - misp-objects/index.qmd
        - correlation/index.qmd
        - warninglists/index.qmd
        - noticelists/index.qmd
    - part: "Use Cases"
      chapters:
        - false-positives/index.qmd
        - pivoting/index.qmd
    - part: "Sharing & Synchronisation"
      chapters:
        - sharing/index.qmd
        - managing-feeds/index.qmd
        - collections/index.qmd
        - cryptographic-keys/index.qmd
    - part: "Automation & Integration"
      chapters:
        - automation/index.qmd
        - pymisp/index.qmd
        - misp-zmq/index.qmd
        - modules/index.qmd
        - connectors/index.qmd
    - part: "Administration"
      chapters:
        - administration/index.qmd
        - workflows/index.qmd
        - updating-python/index.qmd
    - part: "Reference & FAQ"
      chapters:
        - keyboard-shortcuts/index.qmd
        - translation/index.qmd
        - faq/index.qmd
        - dev-faq/index.qmd
        - user-stories/index.qmd
        - user-personas/index.qmd
  appendices:
    - appendices/index.qmd
    - glossary.qmd
    - contributing/index.qmd
    - acknowledgements/index.qmd

# Executable PyMISP/REST cells run locally against the dev instance and are
# frozen into _freeze/ (committed), so CI renders without a live instance (D3/A10).
# `freeze: true` (not `auto`) is required: CI has no MISP instance or Jupyter
# kernel, so it must ALWAYS reuse the committed _freeze/ cells and never try to
# re-execute. To refresh the frozen output, re-render the executable chapter(s)
# locally against a live instance (QUARTO_PYTHON + MISP_URL/MISP_KEY) and commit
# the updated _freeze/.
execute:
  freeze: true

format:
  html:
    grid:
      sidebar-width: 260px
      body-width: 850px
      margin-width: 220px
    theme:
      light: [cosmo, assets/misp.scss]
      dark: [darkly, assets/misp.scss]
    toc: true
    toc-depth: 3
    include-after-body: assets/reference-tables.html
    code-copy: true
    code-overflow: wrap
    code-block-bg: true
    link-external-newwindow: true
    number-sections: false
  epub:
    cover-image: cover.jpg
    toc: true
    number-sections: false
  typst:
    papersize: a4
    toc: true
    toc-depth: 1
    number-sections: false
    fontsize: 10.5pt
    mainfont: Source Sans 3
    codefont: Source Code Pro
    font-paths: [assets/pdf/fonts]
    template-partials: [assets/pdf/typst-show.typ]
    filters:
      - path: assets/pdf/pdf-layout.lua
        at: post-quarto
